<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADRESS</title>
<style>
  html,body{margin:0;height:100%;background:#26331f;overflow:hidden}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ================= Constantes =================
const FONT = '"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const W = 1100, HUD = 120, MAP = 1100, H = HUD + MAP;
const HEDGE = 16, ROAD = 76, LOT = 172, STEP = LOT + ROAD, WALK = 4;
const lotX = c => HEDGE + ROAD + c * STEP;
const lotY = r => HEDGE + ROAD + r * STEP;
const MAXS = 210, ACC = 2.2, DEC = 3.5, TURN = 4.6;
const VAN_START = { x: 550, y: 56, a: Math.PI / 2 };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
}
addEventListener('resize', resize); resize();

// ================= Casas =================
const ROOF_COL = { red:'#d8473a', blue:'#3a78d4', green:'#3c9d55', yellow:'#efbf2a', purple:'#8a55c4', gray:'#8b9099' };
const DOOR_COL = { yellow:'#ffcc00', red:'#e3262e', pink:'#ff6fb5', teal:'#16c6c0' };
const DOOR_DEFAULT = '#6b4428';

const HOUSES = [
  { name:'Seu Juca',     roof:'red',    f:['chimney','sunflowers','doghouse'] },
  { name:'Dona Cida',    roof:'blue',   f:['dish','flamingo'] },
  { name:'Seu Bené',     roof:'green',  f:['solar','trampoline'] },
  { name:'Dona Lurdes',  roof:'yellow', f:['tank','clothesline','gnome'] },
  { name:'Tio Zeca',     roof:'purple', f:['rooster','fruit'] },
  { name:'Dona Neide',   roof:'gray',   door:'teal', f:['kite','tires'] },
  { name:'Seu Arlindo',  roof:'red',    f:['patch','bike','mailbox'] },
  { name:'Dona Zuleica', roof:'blue',   f:['chimney','pool','ballbush'] },
  { name:'Seu Valdir',   roof:'green',  door:'yellow', f:['cactus','flamingo'] },
  { name:'Dona Marlene', roof:'yellow', f:['dish','swing','mailbox'] },
  { name:'Seu Osvaldo',  roof:'purple', door:'red', f:['bare','fence'] },
  { name:'Dona Filó',    roof:'gray',   f:['solar','fountain','gnome'] },
  { name:'Seu Tonho',    roof:'red',    f:['tank','trampoline'] },
  { name:'Dona Célia',   roof:'blue',   door:'pink', f:['kite','fruit'] },
  { name:'Seu Dito',     roof:'green',  f:['chimney','clothesline','fence'] },
  { name:'Dona Rosa',    roof:'yellow', f:['rooster','ballbush','bike'] },
];
HOUSES.forEach(h => { h.tags = ['roof:' + h.roof].concat(h.door ? ['door:' + h.door] : [], h.f); });

const PHRASE = {
  'roof:red':'telhado vermelho', 'roof:blue':'telhado azul', 'roof:green':'telhado verde',
  'roof:yellow':'telhado amarelo', 'roof:purple':'telhado roxo', 'roof:gray':'telhado cinza',
  'door:yellow':'porta amarela', 'door:red':'porta vermelha', 'door:pink':'porta cor-de-rosa', 'door:teal':'porta azul-turquesa',
  chimney:'uma chaminé soltando fumaça', dish:'uma antena parabólica', solar:'painéis solares',
  tank:'uma caixa-d’água no telhado', rooster:'um galo de metal no telhado', kite:'uma pipa presa no telhado',
  patch:'telhas remendadas de outra cor', mailbox:'uma caixa de correio torta', fence:'uma cerca com uma tábua faltando',
  fruit:'uma árvore com frutas', bare:'uma árvore sem folhas', cactus:'um cacto grande',
  sunflowers:'um canteiro de girassóis', ballbush:'um arbusto em formato de bola', doghouse:'uma casinha de cachorro',
  pool:'uma piscina inflável', trampoline:'um trampolim', swing:'um balanço', bike:'uma bicicleta encostada na cerca',
  flamingo:'um flamingo no jardim', gnome:'um gnomo de jardim', clothesline:'um varal com roupas', tires:'uma pilha de pneus',
  fountain:'uma fonte pequena',
};
const ROOF_ITEMS = ['chimney','dish','solar','tank','rooster','kite','patch'];
const YARD_ITEMS = ['fruit','bare','cactus','sunflowers','ballbush','doghouse','pool','trampoline','swing','bike','flamingo','gnome','clothesline','tires','fountain'];
const ROOF_SPOTS = { TL:[62,26], TR:[112,26], BL:[62,56], BR:[112,56], MID:[86,41] };
const ROOF_PREF = { chimney:['TR','TL'], dish:['TL','TR'], solar:['BL','BR'], tank:['TL','TR'], rooster:['MID'], kite:['BR','BL'], patch:['BR','BL'] };
const YARD_SLOTS = [[40,128],[134,128]];

// Posiciona objetos de cada casa uma única vez
HOUSES.forEach(h => {
  const used = new Set();
  h.roofItems = h.f.filter(k => ROOF_ITEMS.includes(k)).map(k => {
    const s = ROOF_PREF[k].find(p => !used.has(p)); used.add(s); return { k, p: ROOF_SPOTS[s] };
  });
  h.yardItems = h.f.filter(k => YARD_ITEMS.includes(k)).map((k, i) => ({ k, p: YARD_SLOTS[i] }));
});

// ================= Pistas =================
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function subsets(arr, k, start = 0, cur = [], out = []) {
  if (cur.length === k) { out.push(cur.slice()); return out; }
  for (let i = start; i < arr.length; i++) { cur.push(arr[i]); subsets(arr, k, i + 1, cur, out); cur.pop(); }
  return out;
}
const isUnique = (h, s) => HOUSES.every((o, i) => i === h || !s.every(t => o.tags.includes(t)));
function makeClue(h) {
  const tags = HOUSES[h].tags;
  for (let k = 1; k <= tags.length; k++) {
    const opts = subsets(tags, k).filter(s => isUnique(h, s));
    if (!opts.length) continue;
    // às vezes combina cor + objeto, mesmo quando um objeto sozinho bastaria
    if (k === 1 && Math.random() < 0.4) {
      const withColor = subsets(tags, 2).filter(s => s[0].startsWith('roof:') && isUnique(h, s));
      if (withColor.length) return pick(withColor);
    }
    return pick(opts);
  }
}
function phrase(tags) {
  const p = tags.map(t => PHRASE[t]);
  return p.length === 1 ? p[0] : p.slice(0, -1).join(', ') + ' e ' + p[p.length - 1];
}
// Verificação de integridade do conjunto de casas
(function validate() {
  const keys = HOUSES.map(h => h.tags.slice().sort().join('|'));
  console.assert(new Set(keys).size === 16, 'Combinações repetidas!');
  HOUSES.forEach((h, i) => console.assert([1,2,3].some(k => subsets(h.tags, k).some(s => isUnique(i, s))), 'Casa sem pista única: ' + i));
})();

// ================= Falas =================
const COMPLAINTS = [
  'De novo uma entrega errada? Isso não é meu!',
  'Eu pedi uma pizza, e isso claramente não é uma pizza.',
  'Meu filho, nem meu nome está nisso.',
  'Você tocou a campainha no meio da minha novela pra isso?',
  'Moço, eu só assino jornal, e nem leio.',
  'Não é meu, mas obrigado pela visita, eu acho.',
  'Não é meu; o gato até ficou animado, mas não é.',
  'Tá escrito “frágil” e você sacudiu até aqui pra nada?',
  'Eu tenho cara de quem compra isso?',
  'Você viu meu quintal e pensou que eu tinha comprado uma prancha?',
  'Terceira caixa errada da semana, e ainda é quarta-feira!',
  'Eu estava cochilando, e isso nem é meu.',
];
const FEATURE_COMPLAINTS = {
  flamingo:'Só porque eu tenho um flamingo não quer dizer que eu compro tudo pela internet.',
  gnome:'Nem o meu gnomo sabe de quem é isso, e ele sabe de tudo.',
  doghouse:'Se fosse ração, o cachorro aceitava, mas não é.',
  chimney:'Tô cuidando do fogão a lenha, e isso não é meu!',
  dish:'Tenho trezentos canais e nenhum deles mandou isso.',
  pool:'Tô de maiô, não vou assinar nada, e isso não é meu!',
  tires:'Se não for pneu, não é meu.',
  trampoline:'Pulei até aqui pra atender e nem é meu?',
  cactus:'Meu cacto é mais simpático que essa caixa, e ela nem é minha.',
  swing:'Eu tava no balanço, sabia? Não é meu!',
};
const HINTS = [
  p => `Acho que é do pessoal da casa com ${p}.`,
  p => `Talvez seja da casa com ${p}.`,
  p => `Se não me engano, é da casa com ${p}.`,
  p => `Tenta lá na casa com ${p}.`,
  p => `Deve ser da casa com ${p}, eu acho.`,
];
const REPEATS = [
  p => `De novo você? Já falei: acho que é da casa com ${p}.`,
  p => `Continua não sendo meu. Tenta a casa com ${p}, como eu disse.`,
];
const NOHINT = [
  'E sei lá de quem é; segue a pista que você tem aí.',
  'Não faço ideia de quem seja, sinceramente.',
  'Pergunta pra outro, porque eu não sei.',
];
const NOHINT_AGAIN = [
  'Ainda não é meu! Segue a pista que você tem.',
  'Voltou? Continua não sendo meu.',
];
const SUCCESS = [
  'Finalmente! Era essa mesmo. Muito obrigado!',
  'Ah, minha encomenda! Já achava que tinha fugido. Obrigado!',
  'Isso! Era essa mesmo. Obrigado pela paciência!',
];
const SHIRTS = ['#e4572e','#4f86c6','#7bb661','#f2a541','#9b5de5','#ef476f','#06aed5','#8d6e63'];
const HAIRS  = ['#3b2a1a','#9e9e9e','#f0d58c','#6b3e26','#222','#d9d9d9','#a0522d','#555'];

// ================= Áudio =================
let AC = null, eng = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 260; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination); o.start(); o2.start();
    eng = { o, o2, g };
  } catch (e) { AC = null; }
}
function tone(freq, at, dur, type = 'sine', vol = 0.12) {
  if (!AC) return;
  const t0 = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfxBell = () => { tone(880, 0, 0.45, 'sine', 0.13); tone(698, 0.3, 0.6, 'sine', 0.13); };
const sfxGrumble = () => { tone(190, 0, 0.12, 'triangle', 0.08); tone(150, 0.13, 0.18, 'triangle', 0.08); };
const sfxSuccess = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.35, 'triangle', 0.1));
function updEngine(running) {
  if (!eng) return;
  const t = AC.currentTime, s = Math.abs(van.speed);
  eng.g.gain.setTargetAtTime(running ? 0.012 + 0.022 * (s / MAXS) : 0, t, 0.12);
  const fr = 42 + s * 0.3;
  eng.o.frequency.setTargetAtTime(fr, t, 0.1); eng.o2.frequency.setTargetAtTime(fr * 0.5, t, 0.1);
}

// ================= Entrada =================
const keys = new Set(), pressed = new Set();
addEventListener('keydown', e => {
  initAudio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (!keys.has(e.code)) pressed.add(e.code);
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const actionPressed = () => pressed.has('KeyE') || pressed.has('Space') || pressed.has('Enter');

// ================= Estado do jogo =================
let layout = [], slotOf = [], route = [], clues = [], step = 0;
let prevRoute = null, prevPerm = null;
let noHintVisited = new Set(), usedComplaints = new Set();
const van = { x: 0, y: 0, a: 0, speed: 0 };
let state = 'fadeIn', stateT = 0, fade = 1, dialog = null, pending = -1, delivered = 0, nearHouse = -1;

function newRound() {
  let perm;
  do { perm = shuffle([...Array(16).keys()]); } while (prevPerm && perm.every((v, i) => v === prevPerm[i]));
  layout = perm; slotOf = []; layout.forEach((h, s) => slotOf[h] = s);

  const len = Math.random() < 0.5 ? 3 : 4;
  for (let tries = 0; tries < 50; tries++) {
    route = shuffle([...Array(16).keys()]).slice(0, len);
    if (!prevRoute) break;
    if (route[len - 1] !== prevRoute[prevRoute.length - 1] && route[0] !== prevRoute[0]) break;
  }
  clues = route.map(makeClue);
  step = 0; noHintVisited = new Set(); usedComplaints = new Set(); dialog = null; pending = -1;
  prevPerm = perm; prevRoute = route.slice();
  Object.assign(van, VAN_START, { speed: 0 });
}

function complaintFor(h) {
  const hs = HOUSES[h];
  const special = hs.f.filter(k => FEATURE_COMPLAINTS[k] && !usedComplaints.has(FEATURE_COMPLAINTS[k]));
  let c;
  if (special.length && Math.random() < 0.5) c = FEATURE_COMPLAINTS[pick(special)];
  else {
    const pool = COMPLAINTS.filter(x => !usedComplaints.has(x));
    c = pick(pool.length ? pool : COMPLAINTS);
  }
  usedComplaints.add(c);
  return c;
}

function resolveVisit(h) {
  const recipient = route[route.length - 1];
  let text, success = false;
  if (h === recipient) {
    success = true; text = pick(SUCCESS);
  } else {
    const idx = route.indexOf(h);
    if (idx === step) {                      // casa indicada: reclama e dá o próximo palpite
      step++;
      text = complaintFor(h) + ' ' + pick(HINTS)(phrase(clues[step]));
    } else if (idx >= 0 && idx < step) {     // já visitada: repete o mesmo palpite
      text = pick(REPEATS)(phrase(clues[idx + 1]));
    } else if (noHintVisited.has(h)) {       // fora da rota, de novo
      text = pick(NOHINT_AGAIN);
    } else {                                 // fora da indicação atual: não altera a rota
      noHintVisited.add(h);
      text = complaintFor(h) + ' ' + pick(NOHINT);
    }
  }
  dialog = { h, name: HOUSES[h].name, text, success };
  state = 'dialog'; stateT = 0;
  if (success) { delivered++; sfxSuccess(); } else sfxGrumble();
}

// ================= Física =================
function solids() {
  const out = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++)
    out.push([lotX(c) - WALK, lotY(r) - WALK, LOT + WALK * 2, LOT + WALK * 2]);
  return out;
}
const SOLIDS = solids();
function resolveCollisions() {
  let hit = false;
  const R = 12.5;
  for (let it = 0; it < 3; it++) {
    for (const off of [-15, 0, 15]) {
      const cx = van.x + Math.cos(van.a) * off, cy = van.y + Math.sin(van.a) * off;
      for (const [rx, ry, rw, rh] of SOLIDS) {
        const px = Math.max(rx, Math.min(cx, rx + rw)), py = Math.max(ry, Math.min(cy, ry + rh));
        let dx = cx - px, dy = cy - py, d = Math.hypot(dx, dy);
        if (d < R) {
          if (d < 1e-4) { dx = 0; dy = -1; d = 1e-4; }
          const push = (R - d) / (d || 1);
          van.x += dx * push; van.y += dy * push; hit = true;
        }
      }
      const lo = HEDGE + R, hi = MAP - HEDGE - R;
      if (cx < lo) { van.x += lo - cx; hit = true; }
      if (cx > hi) { van.x -= cx - hi; hit = true; }
      if (cy < lo) { van.y += lo - cy; hit = true; }
      if (cy > hi) { van.y -= cy - hi; hit = true; }
    }
  }
  if (hit) van.speed *= 0.9;
}
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const doorPoint = h => { const s = slotOf[h]; return [lotX(s % 4) + 86, lotY(Math.floor(s / 4)) + LOT + 26]; };

function drive(dt) {
  const ix = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const iy = (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0);
  if (ix || iy) {
    const d = angDiff(Math.atan2(iy, ix), van.a);
    van.a += Math.sign(d) * Math.min(Math.abs(d), TURN * dt);
    const tgt = MAXS * Math.max(0.25, Math.cos(d));
    van.speed += (tgt - van.speed) * Math.min(1, ACC * dt);
  } else {
    van.speed -= van.speed * Math.min(1, DEC * dt);
    if (van.speed < 3) van.speed = 0;
  }
  van.x += Math.cos(van.a) * van.speed * dt;
  van.y += Math.sin(van.a) * van.speed * dt;
  resolveCollisions();

  nearHouse = -1;
  if (van.speed < 35) {
    let best = 60;
    for (let h = 0; h < 16; h++) {
      const [dx, dy] = doorPoint(h), d = Math.hypot(van.x - dx, van.y - dy);
      if (d < best) { best = d; nearHouse = h; }
    }
  }
  if (nearHouse >= 0 && actionPressed()) {
    pending = nearHouse; state = 'ring'; stateT = 0; van.speed = 0; nearHouse = -1; sfxBell();
  }
}

// ================= Loop =================
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt; stateT += dt;
  switch (state) {
    case 'drive': drive(dt); break;
    case 'ring': if (stateT > 0.8) resolveVisit(pending); break;
    case 'dialog':
      if ((stateT > 0.25 && actionPressed()) || (dialog.success && stateT > 4.5)) {
        if (dialog.success) { state = 'fadeOut'; stateT = 0; }
        else { state = 'drive'; stateT = 0; dialog = null; }
      }
      break;
    case 'fadeOut':
      fade = Math.min(1, stateT / 0.8);
      if (fade >= 1) { newRound(); state = 'fadeIn'; stateT = 0; }
      break;
    case 'fadeIn':
      fade = Math.max(0, 1 - stateT / 0.8);
      if (fade <= 0) { state = 'drive'; stateT = 0; }
      break;
  }
  updEngine(state === 'drive');
  pressed.clear();
  render();
  requestAnimationFrame(frame);
}

// ================= Desenho: utilitários =================
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function ell(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts, fill) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, a = Math.abs(p);
  r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
  return `rgb(${r},${g},${b})`;
}
const shadow = (x, y, rx, ry) => ell(x, y, rx, ry, 'rgba(0,0,0,.18)');

// ================= Desenho: objetos do telhado =================
const DRAW_ROOF = {
  chimney(t) {
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(-4, -5, 12, 14);
    ctx.fillStyle = '#a64a33'; ctx.fillRect(-6, -7, 12, 14);
    ctx.strokeStyle = '#7b3322'; ctx.lineWidth = 0.8;
    for (let y = -3; y < 7; y += 4) line(-6, y, 6, y);
    ctx.fillStyle = '#7b3322'; ctx.fillRect(-7.5, -10, 15, 4);
    ctx.fillStyle = '#222'; ctx.fillRect(-4.5, -9.5, 9, 2.5);
    for (let i = 0; i < 5; i++) {
      const ph = (t * 0.45 + i / 5) % 1;
      const x = ph * 16 + Math.sin(t * 2 + i) * 2, y = -12 - ph * 30;
      ctx.globalAlpha = 0.6 * (1 - ph);
      circ(x, y, 3 + ph * 7, '#e8e8e8');
    }
    ctx.globalAlpha = 1;
  },
  dish() {
    shadow(3, 3, 10, 9);
    ell(0, 0, 10.5, 9.5, '#b9bec4'); ell(0.5, 0.5, 9, 8, '#f4f5f6'); ell(1.5, 1.5, 5, 4.5, '#dde1e5');
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1.4; line(1, 1, -7, -7); circ(-7, -7, 2.2, '#333');
  },
  solar() {
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(-15, -8, 34, 20);
    ctx.fillStyle = '#c9d0d8'; ctx.fillRect(-17, -10, 34, 20);
    ctx.fillStyle = '#1d3a7a'; ctx.fillRect(-15.5, -8.5, 31, 17);
    ctx.strokeStyle = '#6f93dc'; ctx.lineWidth = 0.8;
    for (let x = -15.5 + 7.75; x < 15; x += 7.75) line(x, -8.5, x, 8.5);
    line(-15.5, 0, 15.5, 0);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; poly([-15, -8, -5, -8, -14, 8, -15, 8], 'rgba(255,255,255,.18)');
  },
  tank() {

function drawLot(h, x0, y0, t) {
  const hs = HOUSES[h];
  ctx.save(); ctx.translate(x0, y0);
  // calçada e grama
  ctx.fillStyle = '#d4cdbb'; ctx.fillRect(-WALK, -WALK, LOT + WALK * 2, LOT + WALK * 2);
  ctx.fillStyle = '#95cc68'; ctx.fillRect(0, 0, LOT, LOT);
  ctx.fillStyle = '#8bc25f';
  for (let i = 0; i < 14; i++) { const gx = (i * 53 + h * 17) % 160 + 6, gy = (i * 37 + h * 29) % 160 + 6; ctx.fillRect(gx, gy, 2, 5); ctx.fillRect(gx + 3, gy + 1, 2, 4); }
  // caminho
  ctx.fillStyle = '#e8dfcb'; ctx.fillRect(79, 100, 14, 72);
  ctx.fillStyle = '#d6cbb2'; for (let y = 104; y < 170; y += 10) ctx.fillRect(81, y, 10, 1.5);
  // cerca (fundo e lados)
  ctx.strokeStyle = '#a57a4c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(2, 168); ctx.lineTo(2, 2); ctx.lineTo(170, 2); ctx.lineTo(170, 168); ctx.stroke();
  ctx.fillStyle = '#7d5a35';
  for (let p = 2; p <= 170; p += 28) { ctx.fillRect(p - 2, 0, 4, 4); ctx.fillRect(0, p - 2, 4, 4); ctx.fillRect(168, p - 2, 4, 4); }
  // casa
  drawHouse(hs, t);
  // objetos do quintal
  hs.yardItems.forEach(({ k, p }) => {
    ctx.save();
    ctx.translate(p[0], k === 'bike' ? 150 : p[1]); ctx.scale(1.18, 1.18);
    DRAW_YARD[k](t); ctx.restore();
  });
  // caixa de correio
  ctx.save(); ctx.translate(110, 166);
  const crooked = hs.f.includes('mailbox');
  if (crooked) { ctx.rotate(0.75); shadow(-2, 1, 6, 2); }
  ctx.scale(1.25, 1.25);
  ctx.fillStyle = '#6b4526'; ctx.fillRect(-1.5, -14, 3, 14);
  ctx.fillStyle = '#3f6fb0'; rr(-7, -22, 14, 9, 3); ctx.fill();
  if (crooked) {
    ctx.fillStyle = '#2b4f86'; poly([-7, -17, -11, -12, -7, -13], '#2b4f86'); // tampa aberta pendurada
    ctx.strokeStyle = '#223d66'; ctx.lineWidth = 1; line(-3, -21, 0, -16); line(2, -21, 4, -18);
    ctx.fillStyle = '#e63946'; ctx.fillRect(5, -15, 5, 2); // bandeirinha caída
  } else {
    ctx.fillStyle = '#e63946'; ctx.fillRect(6, -26, 2, 5);
  }
  ctx.restore();
  // cerca da frente (tábuas)
  const missing = hs.f.includes('fence');
  ctx.strokeStyle = '#b9ae98'; ctx.lineWidth = 1.5; line(3, 168, 72, 168); line(100, 168, 169, 168);
  for (let x = 4; x < 168; x += 9) {
    if (x > 68 && x < 100) continue;
    if (missing && x === 31) continue;
    ctx.fillStyle = '#b9ae98'; ctx.fillRect(x - 0.5, 160.5, 7, 11);
    poly([x, 162, x + 3, 158, x + 6, 162], '#f6f1e6');
    ctx.fillStyle = '#f6f1e6'; ctx.fillRect(x, 161, 6, 10);
  }
  ctx.fillStyle = '#7d5a35'; ctx.fillRect(68, 157, 4, 14); ctx.fillRect(100, 157, 4, 14);
  if (missing) {
    ctx.save(); ctx.translate(36, 181); ctx.rotate(0.35);
    ctx.fillStyle = '#b9ae98'; ctx.fillRect(-8.5, -3.5, 17, 7); ctx.fillStyle = '#efe7d6'; ctx.fillRect(-8, -3, 16, 6);
    ctx.restore();
  }
  ctx.restore();
}

function drawHouse(hs, t) {

  ctx.fillStyle = '#3b2c1e'; ctx.fillRect(76.5, 73, 19, 25);

  for (let y = 17; y < 70; y += 7) {

  circ(0, -10, 6.5, '#f0c49a');

  ctx.fillStyle = '#f3d9a6'; ctx.fillRect(-8, -6, 2, 12); ctx.fillRect(-13, -1, 12, 2);
  ctx.fillStyle = '#2b4a6e'; rr(10, -11, 8, 22, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(12, -9, 2, 7);
  ctx.fillStyle = '#fff7a0'; ctx.fillRect(22, -11, 3, 5); ctx.fillRect(22, 6, 3, 5);
  ctx.fillStyle = '#d62020'; ctx.fillRect(-25, -11, 2, 5); ctx.fillRect(-25, 6, 2, 5);
  ctx.fillStyle = '#b8480a'; ctx.fillRect(9, -17, 4, 3); ctx.fillRect(9, 14, 4, 3);
  ctx.restore();
}

function drawMap(t) {
  // sebe
  ctx.fillStyle = '#3c7a3a'; ctx.fillRect(0, 0, MAP, MAP);
  ctx.fillStyle = '#4a8c45';
  for (let i = 8; i < MAP; i += 18) { circ(i, 8, 9, '#4a8c45'); circ(i, MAP - 8, 9, '#4a8c45'); circ(8, i, 9, '#4a8c45'); circ(MAP - 8, i, 9, '#4a8c45'); }
  // asfalto
  ctx.fillStyle = '#5d6470'; ctx.fillRect(HEDGE, HEDGE, MAP - HEDGE * 2, MAP - HEDGE * 2);
  // entrada
  ctx.fillRect(512, 0, 76, HEDGE + 2);
  ctx.fillStyle = '#b8b0a0'; ctx.fillRect(504, 0, 8, 20); ctx.fillRect(588, 0, 8, 20);
  ctx.fillStyle = '#8a5a36'; rr(420, 1, 80, 17, 3); ctx.fill();
  ctx.fillStyle = '#fff3d6'; ctx.font = `bold 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('VILA ADRESS', 460, 10);
  // faixas
  ctx.strokeStyle = '#f2d45c'; ctx.lineWidth = 2.5; ctx.setLineDash([14, 12]);
  for (let i = 0; i < 5; i++) {
    const cc = HEDGE + ROAD / 2 + i * STEP;
    for (let j = 0; j < 4; j++) {
      const a = lotX(j) - WALK + 10, b = lotX(j) + LOT + WALK - 10;
      line(a, cc, b, cc); line(cc, a, cc, b);
    }
  }
  ctx.setLineDash([]);
  // lotes
  for (let s = 0; s < 16; s++) drawLot(layout[s], lotX(s % 4), lotY(Math.floor(s / 4)), t);
  // morador
  if ((state === 'ring' && stateT > 0.5) || state === 'dialog' || state === 'fadeOut') {
    const h = dialog ? dialog.h : pending, s = slotOf[h];
    drawResident(h, lotX(s % 4) + 86, lotY(Math.floor(s / 4)) + 150, t, dialog && dialog.success);
  }
  drawVan();
  if (state === 'drive' && nearHouse >= 0) {
    const bx = van.x, by = van.y - 42;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(bx - 55, by - 13, 112, 28, 9); ctx.fill();
    ctx.fillStyle = '#fffaf0'; rr(bx - 57, by - 16, 112, 28, 9); ctx.fill();
    ctx.strokeStyle = '#e8661a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#3a2a1a'; ctx.font = `bold 16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('E — Entregar', bx - 1, by - 1.5);
  }
}

// ================= HUD =================
function wrap(text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function fitText(text, maxW, maxLines, size, weight) {
  let s = size, lines;
  for (; s >= 14; s -= 2) { ctx.font = `${weight} ${s}px ${FONT}`; lines = wrap(text, maxW); if (lines.length <= maxLines) break; }
  return { lines, size: s };
}
function drawHUD() {
  ctx.fillStyle = '#fff3d6'; ctx.fillRect(0, 0, W, HUD);
  ctx.fillStyle = '#e6cc98'; ctx.fillRect(0, HUD - 4, W, 4);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.font = `900 28px ${FONT}`; ctx.fillStyle = '#e8661a'; ctx.fillText('ADRESS', 22, 26);
  // contador
  const ct = `Entregas: ${delivered}`;
  ctx.font = `bold 17px ${FONT}`; const cw = ctx.measureText(ct).width + 44;
  ctx.fillStyle = '#ffe2b8'; rr(W - 22 - cw, 11, cw, 30, 15); ctx.fill();
  ctx.fillStyle = '#c98a4a'; ctx.fillRect(W - 12 - cw, 19, 14, 14); ctx.fillStyle = '#f3d9a6'; ctx.fillRect(W - 6 - cw, 19, 2, 14);
  ctx.fillStyle = '#5a3c1e'; ctx.textAlign = 'right'; ctx.fillText(ct, W - 34, 26.5);
  // linha de estado
  ctx.textAlign = 'center'; ctx.font = `15px ${FONT}`; ctx.fillStyle = '#9a8660';
  let sub = 'WASD / Setas: dirigir   ·   E: entregar';
  if (state === 'dialog') sub = dialog.success ? '✔ Entrega concluída!   ·   E / Espaço: continuar' : 'E / Espaço: continuar';
  if (state === 'dialog' && dialog.success) { ctx.fillStyle = '#2a9d4b'; ctx.font = `bold 16px ${FONT}`; }
  ctx.fillText(sub, W / 2, 26);
  // texto principal
  let main, color = '#3a2a1a', weight = 'bold';
  if (state === 'ring') { main = 'Ding-dong… 🔔'; color = '#8a7355'; }
  else if (state === 'dialog') { main = `${dialog.name}: “${dialog.text}”`; color = dialog.success ? '#1f7a3a' : '#7a2e1a'; weight = '600'; }
  else if (state === 'fadeOut') { main = 'Entrega concluída! Preparando a próxima…'; color = '#1f7a3a'; }
  else if (step === 0) main = `Entrega para a casa com ${phrase(clues[0])}.`;
  else main = `Palpite do morador: casa com ${phrase(clues[step])}.`;
  const { lines, size } = fitText(main, W - 60, 2, 25, weight);
  ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${FONT}`;
  const lh = size * 1.25, y0 = 82 - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y0 + i * lh));
}

function render() {
  const k = cv.width / W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawHUD();
  ctx.save(); ctx.translate(0, HUD); ctx.beginPath(); ctx.rect(0, 0, MAP, MAP); ctx.clip();
  drawMap(T); ctx.restore();
  if (fade > 0) { ctx.fillStyle = `rgba(27,36,24,${fade})`; ctx.fillRect(0, 0, W, H); }
}

newRound();
requestAnimationFrame(frame);
</script>
