<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADRESS — EXPERIMENTAL</title>
<style>
/* celulares com entalhe (viewport-fit=cover): os botões fixos não ficam embaixo dele; no computador env() = 0 e nada muda */
@supports (left: env(safe-area-inset-left)) {
  body .back-btn { left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
  body .menu-btn, body .menu-panel { left: max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left)); }
  body .menu-btn, body .hint-btn, body .music-btn { bottom: max(clamp(10px, 1.6vh, 20px), env(safe-area-inset-bottom)); }
  body .music-btn { left: calc(max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left)) + 7.6em); }
  body .hint-btn, body .missions-btn { right: max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-right)); }
}
  html, body { margin: 0; height: 100%; overflow: hidden; background: #26331f; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { flex: 0 0 auto; position: relative; z-index: 2; }
  #stage { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
  #stage > canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="exp-badge" style="position:fixed;right:8px;bottom:4px;z-index:9998;pointer-events:none;font:700 11px system-ui,sans-serif;letter-spacing:.08em;color:#fff3d6;background:rgba(48,32,20,.72);border:1px solid #FF7A1A;border-radius:6px;padding:2px 7px">VERSÃO EXPERIMENTAL · história completa · rodada 2</div>
<div id="app">
  <div id="hud"></div>
  <div id="stage"></div>
</div>
<script>
/* VERSÃO EXPERIMENTAL (rodada 2): salvamento isolado. Toda chave "adress.*" vira "adressx2.*" (a versão principal nunca é lida
   nem alterada; a rodada 1, em "adressx.*", também não). Na 1ª abertura, o progresso da versão principal é COPIADO (nunca
   movido) para o prefixo experimental. */
(function () {
  try {
    var ls = window.localStorage, P = 'adress.', X = 'adressx2.', MARK = 'adressx2.__copied', CLEAN = 'adressx2.__clean1';
    // não copia o ponto salvo da batalha da principal (os passos são outros) nem as marcas de teste do cadeado
    var skip = function (k) { return k === 'adress.battle.cp' || k.indexOf('adress.dev.') === 0; };
    if (!ls.getItem(MARK)) {
      var keys = [];
      for (var i = 0; i < ls.length; i++) { var k = ls.key(i); if (k && k.indexOf(P) === 0) keys.push(k); }
      keys.forEach(function (k) { if (skip(k)) return; var nk = X + k.slice(P.length); if (ls.getItem(nk) === null) ls.setItem(nk, ls.getItem(k)); });
      ls.setItem(MARK, String(keys.length)); ls.setItem(CLEAN, '1');
    }
    if (!ls.getItem(CLEAN)) {                           // cópias antigas: tira só o que veio da principal (igual ao valor de lá)
      ['battle.cp', 'dev.battle', 'dev.battlePlus'].forEach(function (s) { var v = ls.getItem(P + s); if (v !== null && ls.getItem(X + s) === v) ls.removeItem(X + s); });
      ls.setItem(CLEAN, '1');
    }
    var map = function (k) { k = String(k); return k.indexOf(P) === 0 ? X + k.slice(P.length) : k; };
    var proto = Object.getPrototypeOf(ls), g = proto.getItem, s = proto.setItem, r = proto.removeItem;
    var wrap = {
      getItem: function (k) { return g.call(ls, map(k)); },
      setItem: function (k, v) { return s.call(ls, map(k), v); },
      removeItem: function (k) { return r.call(ls, map(k)); },
      key: function (i) { return ls.key(i); }, clear: function () { ls.clear(); },
      get length() { return ls.length; }
    };
    Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { return wrap; } });
    window.ADRESS_EXPERIMENT = true;
  } catch (e) { console.warn('isolamento do salvamento falhou', e); }
})();
</script>
<!--BUNDLE-->
</body>
</html>
