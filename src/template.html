<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADRESS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #26331f; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { flex: 0 0 auto; position: relative; z-index: 2; }
  #stage { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
  #stage > canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="stage"></div>
</div>
<!--BUNDLE-->
</body>
</html>
