<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADRESS</title>
<style>
/* celulares com entalhe (viewport-fit=cover): os botões fixos não ficam embaixo dele; no computador env() = 0 e nada muda */
@supports (left: env(safe-area-inset-left)) {
  body .back-btn { left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
  body .menu-btn, body .menu-panel { left: max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left)); }
  body .menu-btn, body .hint-btn, body .music-btn { bottom: max(clamp(10px, 1.6vh, 20px), env(safe-area-inset-bottom)); }
  body .music-btn { left: calc(max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left)) + 7.6em); }
  body .hint-btn, body .missions-btn { right: max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-right)); }
  /* barra do topo: o conteúdo (logo, pista, contador) sai de baixo do entalhe junto com o Voltar (bordas da cor da barra; as laterais deixam o fundo aparecer) */
  body .ahud { border-top: env(safe-area-inset-top) solid #fff7e2; border-left: env(safe-area-inset-left) solid transparent; border-right: env(safe-area-inset-right) solid transparent; }
  body .match-hud { left: max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left)); }
  /* créditos da música: acompanham o botão ♪ (sem cobrir o botão nem entrar na área do entalhe/barra de gestos) */
  body .music-now:not(.lift) { left: calc(max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left)) + 11.1 * clamp(13px, 1.05vw, 17px)); bottom: max(clamp(10px, 1.6vh, 20px), env(safe-area-inset-bottom)); }
  body .music-now.lift { left: max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left)); }
}
@supports (left: env(safe-area-inset-left)) { @media (max-width: 560px) {
  body .music-now:not(.lift) { left: max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left)); bottom: calc(max(clamp(10px, 1.6vh, 20px), env(safe-area-inset-bottom)) + 3.7 * clamp(13px, 1.05vw, 17px)); }
} }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #26331f; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { flex: 0 0 auto; position: relative; z-index: 2; }
  #stage { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
  #stage > canvas { display: block; width: 100%; height: 100%; }
  /* mapa da Carreira: o MENU não existe ali, então o botão de música encosta no canto (sem o vão do MENU) */
  body.on-map .music-btn { left: max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left, 0px)); }
  body.on-map .music-now:not(.lift) { left: calc(max(clamp(10px, 1.4vw, 20px), env(safe-area-inset-left, 0px)) + 3.6 * clamp(13px, 1.05vw, 17px)); }
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="stage"></div>
</div>
<!--BUNDLE-->
</body>
</html>
