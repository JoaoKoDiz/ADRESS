/* ---------- linha de cima: logo | legenda | contador ---------- */
.ahud-top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  column-gap: calc(16 * var(--au));
  min-height: calc(32 * var(--au));
}
.ahud-logo {
  display: flex; align-items: center; gap: calc(8 * var(--au));
  justify-self: start; white-space: nowrap;
}
.ahud-logo svg { width: calc(var(--ahud-logo) * 1.43); height: calc(var(--ahud-logo) * .93); flex: none; display: block; }
.ahud-logo span {
  font-size: var(--ahud-logo); font-weight: 900; line-height: 1;

  color: #e8661a;
  text-shadow: 0 calc(2 * var(--au)) 0 #f6cfa0;

.ahud-sub {

.ahud-sub[data-tone="cont"] { color: #5a3c1e; font-weight: bold; }
.ahud-sub .ahud-key { height: 1.35em; min-width: 1.35em; font-size: .85em; vertical-align: .08em; margin: 0 .15em; }
.ahud-warm { position: absolute; visibility: hidden; pointer-events: none; left: 0; top: 0; }
.ahud-sub[data-tone="success"] { color: #2a9d4b; font-weight: bold; font-size: calc(var(--ahud-sub) * 1.07); }
.ahud-count {

}
.ahud-count svg { width: 1.12em; height: 1.12em; flex: none; display: block; }

  font-size: var(--ahud-main);
  min-height: calc(${2.44} * var(--ahud-main));
  margin-top: calc(2 * var(--au));
}
.ahud-main-txt {
  width: 100%; text-align: center; font-weight: bold;
  line-height: ${1.22};
  overflow-wrap: anywhere; text-wrap: balance;
}
.ahud-main-txt[data-tone="clue"]    { color: #3a2a1a; }
.ahud-main-txt[data-tone="ring"]    { color: #8a7355; }
.ahud-main-txt[data-tone="dialog"]  { color: #7a2e1a; font-weight: 600; }
.ahud-main-txt[data-tone="success"] { color: #1f7a3a; }
.ahud-main-txt .who { font-weight: bold; color: #4a2a18; }
.ahud-main-txt[data-tone="success"] .who { color: #17602d; }

/* ---------- bal\xE3o "E \u2014 Entregar" dentro do palco ---------- */
.ahud-prompt {
  position: absolute; left: 0; top: 0; z-index: 3;
  pointer-events: none; will-change: transform;
  font-size: max(14px, calc(18 * var(--au)));
  padding-bottom: calc(.55em - 2px);   /* altura da ponta: a ponta toca exatamente o ponto (x, y) */
  visibility: hidden;
}
.ahud-bubble {
  box-sizing: border-box; position: relative; display: flex; align-items: center; gap: .4em;
  padding: .28em .8em .28em .33em;
  background: #fffaf0; border: 2px solid #e8661a; border-radius: .7em;
  box-shadow: 0 .22em .55em rgba(30, 22, 10, .3);
  font-family: ${T_}; font-weight: bold; color: #3a2a1a;
  white-space: nowrap; line-height: 1.2;
  transform-origin: 50% 100%;
}
.ahud-bubble::after {
  /* losango girado 45\xB0; s\xF3 a metade de baixo aparece (o texto nunca \xE9 coberto) */
  content: ''; box-sizing: border-box; position: absolute; left: 50%; bottom: -.39em;
  width: .78em; height: .78em;
  background: #fffaf0; border: solid #e8661a; border-width: 0 2px 2px 0;
  clip-path: polygon(100% -2px, 100% 100%, -2px 100%);
  transform: translateX(-50%) rotate(45deg);
}
.ahud-key {
  display: inline-grid; place-items: center;
  min-width: 1.6em; height: 1.6em; padding: 0 .3em;
  border-radius: .42em; background: #e8661a; color: #fff;
  box-shadow: inset 0 -.18em 0 #b94c0e;
  font-size: .9em; line-height: 1;
}
.ahud-prompt.on { visibility: visible; }
/* bal\xE3o AO LADO do ponto (sobre a rua, sem cobrir o quintal da casa): a ponta aponta para a van */
.ahud-prompt[data-side="right"] { padding: 0 0 0 calc(.55em - 2px); }
.ahud-prompt[data-side="left"]  { padding: 0 calc(.55em - 2px) 0 0; }
.ahud-prompt[data-side="right"] .ahud-bubble { transform-origin: 0 50%; }
.ahud-prompt[data-side="left"]  .ahud-bubble { transform-origin: 100% 50%; }
.ahud-prompt[data-side="right"] .ahud-bubble::after {
  left: -.39em; top: 50%; bottom: auto;
  border-width: 0 0 2px 2px;
  clip-path: polygon(0 -2px, 0 100%, calc(100% + 2px) 100%);
  transform: translateY(-50%) rotate(45deg);
}
.ahud-prompt[data-side="left"] .ahud-bubble::after {
  left: auto; right: -.39em; top: 50%; bottom: auto;
  border-width: 2px 2px 0 0;
  clip-path: polygon(-2px 0, 100% 0, 100% calc(100% + 2px));
  transform: translateY(-50%) rotate(45deg);
}

/* ---------- v\xE9u do fade (janela inteira) ---------- */
.ahud-fade {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background: rgb(27, 36, 24); opacity: 0; display: none;
}

.title { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(9px) saturate(1.1); -webkit-backdrop-filter: blur(9px) saturate(1.1); background: rgba(38,51,31,.28);
  font-family: "Trebuchet MS","Segoe UI",system-ui,sans-serif; }
.title.hidden { display: none; }
.title-main { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.title-buttons { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.title.playing .title-buttons { display: none; }   /* no painel Jogar, s\xF3 o logo fica no centro */
.title-logo { font-weight: 900; font-size: clamp(56px, 9vw, 130px); letter-spacing: .06em; color: #ff7a1a;
  text-shadow: 0 6px 0 #8a3a08, 0 12px 30px rgba(0,0,0,.35); margin-bottom: 18px; }
.title-btn { width: clamp(220px, 22vw, 320px); padding: .7em 1em; border: 3px solid #fff; border-radius: 16px;
  background: #fff3d6; color: #3a2a1a; font: 800 clamp(18px, 1.7vw, 26px) "Trebuchet MS","Segoe UI",system-ui,sans-serif;
  letter-spacing: .04em; cursor: pointer; box-shadow: 0 5px 0 #c9a76a, 0 10px 22px rgba(0,0,0,.25); transition: transform .1s; }
.title-btn:hover { transform: translateY(-2px); }
.title-btn:active { transform: translateY(2px); }
.title-btn.primary { background: #ff7a1a; color: #fff; box-shadow: 0 5px 0 #a8480b, 0 10px 22px rgba(0,0,0,.25); }
.title-panel { position: absolute; left: 0; top: 0; bottom: 0; width: clamp(300px, 34vw, 520px); display: none;
  grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; padding: 62px 18px 18px; box-sizing: border-box;
  background: rgba(30,22,14,.55); border-right: 3px solid rgba(255,243,214,.6); }
.title.playing .title-panel { display: grid; }
.title-card { border: 3px solid #fff; border-radius: 18px; display: flex; align-items: center; justify-content: center;
  font: 900 clamp(20px, 2vw, 32px) "Trebuchet MS","Segoe UI",system-ui,sans-serif; letter-spacing: .05em; color: #fff;
  text-shadow: 0 3px 0 rgba(0,0,0,.35); box-shadow: 0 6px 18px rgba(0,0,0,.3); user-select: none; }
.title-card.career { background: #3a78d4; }
.title-card.free { background: #3c9d55; cursor: pointer; }
.title-card.free:hover { filter: brightness(1.1); }
.title-card.shop { grid-column: 1 / span 2; background: #8a55c4; }
.title-driver { position: absolute; right: 0; top: 8%; bottom: 8%; width: min(38vw, 640px); display: none; pointer-events: none; }
.title.playing .title-driver { display: block; }
.title-driver canvas { width: 100%; height: 100%; display: block; }
.title-card.career { cursor: pointer; }
.title-card.career:hover { filter: brightness(1.1); }
.title-fade { position: absolute; inset: 0; background: #1b2418; opacity: 0; transition: opacity .5s; pointer-events: none; z-index: 5; }
.title-bye { color: #fff3d6; font: 800 clamp(22px, 2.4vw, 36px) "Trebuchet MS","Segoe UI",system-ui,sans-serif;
  text-shadow: 0 3px 0 rgba(0,0,0,.4); text-align: center; }

ada, mesmo que se trate de uma dica falsa).",goal:1}],[{id:"blue",name:"Telhado Azul",desc:"Fa\xE7a 3 entregas em casas com telhados azuis (podendo ser ao longo de partidas diferentes).",goal:3},{id:"redWrong",name:"Telhado Vermelho Errado",desc:"Fa\xE7a uma entrega falsa em uma casa com telhado vermelho.",goal:1},{id:"fountain",name:"Fonte Pequena",desc:"Fa\xE7a duas entregas falsas em uma casa com uma fonte pequena (podendo ser ao longo de partidas diferentes).",goal:2},{id:"trampoline",name:"Insistir no Pulo",desc:"Insista em fazer uma entrega falsa na mesma casa que tenha um pula-pula, 4 vezes, na mesma partida.",goal:4},{id:"hint",name:"Pequena Dica",desc:"Use a dica 3 vezes (em partidas diferentes).",goal:3}],[{id:"tenSame",name:"Dez Vezes \xE9 Demais",desc:"Fa\xE7a 10 entregas falsas propositalmente na mesma casa durante uma \xFAnica partida.",goal:10},{id:"tourist",name:"Turista do Bairro",desc:"Passe pela mesma rua 10 vezes antes de realizar a entrega correta.",goal:10},{id:"nextDoor",name:"N\xE3o Era Aqui?",desc:"Fa\xE7a uma entrega em uma das 4 casas imediatamente ao lado daquela indicada pela dica falsa.",goal:1},{id:"opposite",name:"Do Outro Lado",desc:"Insista 3 vezes na entrega errada, em uma das 4 casas dos cantos do bairro, e repita isso logo em seguida, na casa no canto oposto.",goal:1},{id:"dizzy",name:"Manobras Enjoativas",desc:"D\xEA 5 voltas completas em torno de uma mesma casa.",goal:5}],[{id:"colors",name:"Confundi as Cores",desc:"Ao receber uma dica falsa para um pr\xE9dio comercial ou casa de cor azul, entregue propositalmente em um pr\xE9dio comercial ou casa de telhado vermelho.",goal:1},{id:"roosters",name:"Viciado em Galos",desc:"Insista 3 entregas falsas em duas casas diferentes que tenham um galo de metal no telhado, na mesma partida.",goal:2},{id:"fountainSwap",name:"Fonte Errada",desc:"Quando a dica indicar uma casa com fonte pequena, entregue propositalmente em outra casa que tamb\xE9m tenha uma fonte.",goal:1},{id:"expensive",name
